<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MWAA Agent</title>
<style>
  :root {
    --bg: #F3F5F6;
    --surface: #FFFFFF;
    --text: #14202A;
    --text-muted: #56666F;
    --border: #DCE3E6;
    --accent: #0B7285;
    --accent-soft: rgba(11, 114, 133, 0.10);
    --crit: #B5432E;
    --crit-soft: #F7DCD6;
    --ok: #2F8F5B;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161B; --surface: #161E24; --text: #E7EDF0; --text-muted: #93A3AC;
      --border: #283238; --accent: #45BFB8; --accent-soft: rgba(69,191,184,0.12);
      --crit: #E2685A; --crit-soft: #3A211D; --ok: #55C285;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 700; }
  #env-badge {
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent);
    background: var(--accent-soft); border: 1px solid var(--accent);
    border-radius: 999px; padding: 0.15rem 0.6rem;
  }
  #reset-btn {
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    padding: 0.3rem 0.6rem; cursor: pointer;
  }
  #reset-btn:hover { border-color: var(--text-muted); }

  #chat {
    flex: 1; overflow-y: auto; padding: 1.5rem; display: flex;
    flex-direction: column; gap: 1rem; max-width: 760px; width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 0.35rem; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.75rem 0.95rem; font-size: 0.92rem;
    line-height: 1.5; white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--accent); color: white; border-color: var(--accent); }
  .msg.agent .bubble.error { background: var(--crit-soft); border-color: var(--crit); color: var(--crit); }

  .detail { font-size: 0.85rem; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .detail-row {
    display: grid; grid-template-columns: 8.5rem 1fr; gap: 0.5rem;
    padding: 0.5rem 0.75rem; border-top: 1px solid var(--border);
  }
  .detail-row:first-child { border-top: none; }
  .detail-label {
    font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--text-muted); padding-top: 0.15rem;
  }
  .detail-value { white-space: pre-wrap; }
  .detail-value code, .detail pre {
    font-family: var(--font-mono); font-size: 0.78rem; background: var(--bg);
    border-radius: 6px; padding: 0.5rem; display: block; overflow-x: auto; margin: 0;
  }
  .detail-value ol { margin: 0; padding-left: 1.1rem; }
  .dag-row { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.2rem 0; }
  .dag-row .count { font-family: var(--font-mono); color: var(--text-muted); white-space: nowrap; }

  #composer {
    display: flex; gap: 0.6rem; padding: 1rem 1.25rem; border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #composer-inner { max-width: 760px; width: 100%; margin: 0 auto; display: flex; gap: 0.6rem; }
  #input {
    flex: 1; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.92rem; font-family: inherit;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #send-btn {
    padding: 0.65rem 1.1rem; border-radius: 8px; border: none; background: var(--accent);
    color: white; font-weight: 600; cursor: pointer; font-size: 0.9rem;
  }
  #send-btn:disabled { opacity: 0.5; cursor: default; }
  .thinking { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:0.6rem;">
    <h1>MWAA Agent</h1>
    <span id="env-badge">connecting...</span>
  </div>
  <button id="reset-btn" type="button">Reset conversation</button>
</header>

<div id="chat"></div>

<div id="composer">
  <div id="composer-inner">
    <input id="input" type="text" placeholder="Ask about a DAG, or how many failed..." autofocus />
    <button id="send-btn" type="button">Send</button>
  </div>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const envBadge = document.getElementById('env-badge');
  const resetBtn = document.getElementById('reset-btn');

  let sessionId = sessionStorage.getItem('mwaa_session_id') || null;

  fetch('/api/health').then(r => r.json()).then(d => {
    envBadge.textContent = d.environment + ' (' + d.region + ')';
  }).catch(() => { envBadge.textContent = 'unreachable'; });

  function addMessage(role, node) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.appendChild(node);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  function bubble(text, extraClass) {
    const b = document.createElement('div');
    b.className = 'bubble' + (extraClass ? ' ' + extraClass : '');
    b.textContent = text;
    return b;
  }

  function detailRow(label, valueNode) {
    const row = document.createElement('div');
    row.className = 'detail-row';
    const l = document.createElement('div');
    l.className = 'detail-label';
    l.textContent = label;
    const v = document.createElement('div');
    v.className = 'detail-value';
    v.appendChild(valueNode);
    row.appendChild(l);
    row.appendChild(v);
    return row;
  }

  function textNode(t) {
    const s = document.createElement('span');
    s.textContent = t;
    return s;
  }

  function renderDiagnosis(d) {
    const container = document.createElement('div');
    container.appendChild(bubble(d.summary));
    const detail = document.createElement('div');
    detail.className = 'detail';
    if (d.dag_id) detail.appendChild(detailRow('DAG', textNode(d.dag_id)));
    if (d.dag_run_id) detail.appendChild(detailRow('Run', textNode(d.dag_run_id)));
    if (d.failed_at) detail.appendChild(detailRow('Failed at', textNode(d.failed_at)));
    if (d.failed_tasks && d.failed_tasks.length) {
      detail.appendChild(detailRow('Failed tasks', textNode(d.failed_tasks.join(', '))));
    }
    if (d.root_cause) detail.appendChild(detailRow('Root cause', textNode(d.root_cause)));
    if (d.evidence) {
      const pre = document.createElement('pre');
      pre.textContent = d.evidence;
      detail.appendChild(detailRow('Evidence', pre));
    }
    if (d.recommendations && d.recommendations.length) {
      const ol = document.createElement('ol');
      d.recommendations.forEach(r => {
        const li = document.createElement('li');
        li.textContent = r;
        ol.appendChild(li);
      });
      detail.appendChild(detailRow('Recommendations', ol));
    }
    container.appendChild(detail);
    return container;
  }

  function renderSummary(d) {
    const container = document.createElement('div');
    container.appendChild(bubble(d.summary));
    const detail = document.createElement('div');
    detail.className = 'detail';
    detail.appendChild(detailRow('Scope', textNode(d.scope)));
    if (d.environments_checked && d.environments_checked.length) {
      detail.appendChild(detailRow('Environments', textNode(d.environments_checked.join(', '))));
    }
    detail.appendChild(detailRow('Failed DAGs', textNode(String(d.total_failed_dags))));
    detail.appendChild(detailRow('Failed runs', textNode(String(d.total_failed_runs))));
    if (d.failed_dags && d.failed_dags.length) {
      const list = document.createElement('div');
      d.failed_dags.forEach(fd => {
        const row = document.createElement('div');
        row.className = 'dag-row';
        const name = (fd.environment ? '[' + fd.environment + '] ' : '') + fd.dag_id;
        const left = document.createElement('span');
        left.textContent = name;
        const right = document.createElement('span');
        right.className = 'count';
        right.textContent = fd.failed_runs + ' failed' + (fd.latest_failure ? ' · ' + fd.latest_failure : '');
        row.appendChild(left);
        row.appendChild(right);
        list.appendChild(row);
      });
      detail.appendChild(detailRow('By DAG', list));
    }
    container.appendChild(detail);
    return container;
  }

  async function send() {
    const message = inputEl.value.trim();
    if (!message) return;
    inputEl.value = '';
    sendBtn.disabled = true;

    addMessage('user', bubble(message));
    const thinkingWrap = addMessage('agent', bubble('thinking...', ));
    thinkingWrap.querySelector('.bubble').classList.add('thinking');

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      const data = await resp.json();
      sessionId = data.session_id;
      sessionStorage.setItem('mwaa_session_id', sessionId);

      thinkingWrap.remove();
      if (data.kind === 'error') {
        addMessage('agent', bubble('Error: ' + data.summary, 'error'));
      } else if (data.kind === 'summary') {
        addMessage('agent', renderSummary(data.detail));
      } else {
        addMessage('agent', renderDiagnosis(data.detail));
      }
    } catch (err) {
      thinkingWrap.remove();
      addMessage('agent', bubble('Request failed: ' + err, 'error'));
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') send();
  });
  resetBtn.addEventListener('click', async () => {
    if (sessionId) {
      try { await fetch('/api/chat/' + sessionId, { method: 'DELETE' }); } catch (e) {}
    }
    sessionId = null;
    sessionStorage.removeItem('mwaa_session_id');
    chatEl.innerHTML = '';
  });
</script>

</body>
</html>
